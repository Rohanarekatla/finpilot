<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinPilot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5f6b7a; --line:#e3e6ea; --accent:#2457d6;
          --warn:#b26b00; --alert:#c0362c; --ok:#1f7a4d; --band:rgba(36,87,214,.12); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1216; --card:#171b21; --ink:#e7eaee; --muted:#9aa5b1; --line:#2a3038; --accent:#7aa2ff;
            --warn:#f0a83a; --alert:#ff6b5e; --ok:#4cc38a; --band:rgba(122,162,255,.15); }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0 12px 0 0; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .card h2 { font-size:15px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px) { .grid2 { grid-template-columns:1fr; } }
  input, select, button { font:inherit; padding:7px 10px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:wait; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px; }
  .tile { border:1px solid var(--line); border-radius:8px; padding:10px; }
  .tile b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .tile span { color:var(--muted); font-size:13px; }
  .rec { border-left:3px solid var(--accent); padding:8px 12px; margin:10px 0; }
  .rec h3 { margin:0 0 4px; font-size:16px; }
  .rec p { margin:2px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .sev-alert { color:var(--alert); } .sev-warn { color:var(--warn); } .sev-info { color:var(--muted); }
  .verdict { font-weight:600; }
  .verdict.affordable { color:var(--ok); } .verdict.tight, .verdict.affordable_but_delays_goal { color:var(--warn); } .verdict.not_affordable { color:var(--alert); }
  pre { white-space:pre-wrap; font-size:12px; background:var(--bg); padding:8px; border-radius:6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  details summary { cursor:pointer; color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>FinPilot</h1>
  <label>User <input id="user" value="demo" size="10"></label>
  <select id="persona">{% for p in personas %}<option>{{ p }}</option>{% endfor %}</select>
  <button class="ghost" onclick="loadSample()">Load sample</button>
  <form id="up" class="row" onsubmit="upload(event)">
    <input type="file" name="file" accept=".csv" required>
    <button class="ghost">Upload CSV</button>
  </form>
  <button id="run" onclick="analyze()">Analyze</button>
  <span id="status" class="muted"></span>
</header>
<main>
  <section class="card" id="overview" hidden>
    <h2>Overview</h2>
    <p id="narrative"></p>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="card" id="recs-card" hidden>
    <h2>Recommendations</h2>
    <div id="recs"></div>
  </section>

  <div class="grid2">
    <section class="card" id="fc-card" hidden>
      <h2>Forecast (P10 – P90)</h2>
      <canvas id="fc" height="220"></canvas>
      <p class="muted" id="fc-note"></p>
    </section>
    <section class="card" id="ask-card" hidden>
      <h2>Ask FinPilot</h2>
      <form class="row" onsubmit="ask(event)">
        <input id="q" style="flex:1;min-width:220px" placeholder="Can I afford a ₹60,000 trip next month?">
        <button>Ask</button>
      </form>
      <p id="answer"></p>
      <canvas id="sim" height="160" hidden></canvas>
    </section>
  </div>

  <div class="grid2">
    <section class="card" id="findings-card" hidden>
      <h2>What the agents found</h2>
      <div id="findings"></div>
    </section>
    <section class="card" id="goals-card" hidden>
      <h2>Goals</h2>
      <form class="row" onsubmit="addGoal(event)">
        <input id="gname" placeholder="Emergency fund" required>
        <input id="gamt" type="number" placeholder="Amount" required style="width:110px">
        <input id="gdate" type="date" required>
        <button>Add</button>
      </form>
      <ul id="goals"></ul>
      <button class="ghost" onclick="sendDigest()">Send digest now</button>
      <p id="digest" class="muted"></p>
    </section>
  </div>

  <section class="card" id="audit-card" hidden>
    <details><summary>Decision trail for this run</summary><table id="audit"></table></details>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const inr = (v) => (v < 0 ? "-" : "") + "₹" + Math.abs(Math.round(v)).toLocaleString("en-IN");
const user = () => encodeURIComponent($("user").value.trim() || "demo");
let fcChart, simChart;

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}
function busy(msg) { $("status").textContent = msg; $("run").disabled = !!msg; }
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

async function loadSample() {
  busy("Loading sample…");
  try { const r = await api(`/api/users/${user()}/sample/${$("persona").value}`, { method: "POST" });
        busy(""); $("status").textContent = `Imported ${r.imported} transactions`; await analyze(); }
  catch (e) { busy(""); $("status").textContent = e.message; }
}
async function upload(ev) {
  ev.preventDefault(); busy("Uploading…");
  try { const r = await api(`/api/users/${user()}/upload`, { method: "POST", body: new FormData($("up")) });
        busy(""); $("status").textContent = `Imported ${r.imported} transactions`; await analyze(); }
  catch (e) { busy(""); $("status").textContent = e.message; }
}
async function analyze() {
  busy("Agents working…");
  try { render(await api(`/api/users/${user()}/analyze`, { method: "POST" })); busy(""); }
  catch (e) { busy(""); $("status").textContent = e.message; }
}
async function loadLatest() {
  try { render(await api(`/api/users/${user()}/latest`)); } catch (_) {}
}

function render(r) {
  for (const id of ["overview","recs-card","fc-card","ask-card","findings-card","goals-card","audit-card"]) $(id).hidden = false;
  $("narrative").textContent = r.narrative;
  const s = r.stats, f = r.forecast;
  $("tiles").innerHTML = [
    ["Avg monthly income", inr(s.avg_monthly_income)], ["Avg monthly spend", inr(s.avg_monthly_spend)],
    ["Savings rate", s.savings_rate_pct + "%"], ["Fixed costs / month", inr(s.fixed_monthly_costs)],
    ["Balance now", inr(f.start_balance)], [`Balance by ${f.to} (P50)`, inr(f.end_balance_p50)],
  ].map(([k, v]) => `<div class="tile"><b>${v}</b><span>${k}</span></div>`).join("");

  $("recs").innerHTML = r.recommendations.map(x => `
    <div class="rec">
      <h3>${esc(x.title)}</h3>
      <p>${esc(x.action)}</p>
      <p class="muted">${esc(x.why)}</p>
      <p class="muted">${x.monthly_impact ? "Impact " + inr(x.monthly_impact) + "/month · " : ""}${x.one_off_impact ? "One-off " + inr(x.one_off_impact) + " · " : ""}source: ${x.source}
        · <a href="#" onclick="why('${x.rec_id}', this); return false">why?</a></p>
      <div class="why"></div>
    </div>`).join("") || "<p class='muted'>Nothing to act on.</p>";

  $("findings").innerHTML = r.findings.map(x => `<p><b class="sev-${x.severity}">●</b> <b>${esc(x.title)}</b><br><span class="muted">${esc(x.detail)}</span></p>`).join("");

  const ser = r.series;
  fcChart?.destroy();
  fcChart = new Chart($("fc"), { type: "line", data: { labels: ser.dates, datasets: [
    { label: "P90", data: ser.p90, borderWidth: 0, pointRadius: 0, fill: "+2", backgroundColor: getComputedStyle(document.body).getPropertyValue("--band") },
    { label: "P50", data: ser.p50, borderColor: getComputedStyle(document.body).getPropertyValue("--accent"), pointRadius: 0, borderWidth: 2 },
    { label: "P10", data: ser.p10, borderWidth: 0, pointRadius: 0 } ] },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 6 } }, y: { ticks: { callback: inr } } } } });
  $("fc-note").textContent = `Chance of going negative: ${f.prob_negative_pct}% · lowest expected balance ${inr(f.min_balance_p50)} on ${f.min_balance_p50_date}`;
  loadGoals(); loadAudit(r.run_id);
}

async function why(recId, el) {
  const box = el.closest(".rec").querySelector(".why");
  if (box.innerHTML) { box.innerHTML = ""; return; }
  const r = await api(`/api/recommendations/${encodeURIComponent(recId)}/why`);
  box.innerHTML = r.evidence.map(e => `<pre>${esc(e.finding_id)}: ${esc(e.detail)}\n${esc(JSON.stringify(e.data, null, 1))}</pre>`).join("");
}

async function ask(ev) {
  ev.preventDefault();
  $("answer").textContent = "Thinking…";
  try {
    const r = await api(`/api/users/${user()}/ask`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: $("q").value }) });
    const v = r.simulation ? `<span class="verdict ${r.simulation.verdict}">${r.simulation.verdict.replaceAll("_", " ")}</span> — ` : "";
    $("answer").innerHTML = v + esc(r.answer);
    simChart?.destroy(); $("sim").hidden = !r.simulation;
    if (r.simulation) {
      const b = r.simulation.series.baseline, w = r.simulation.series.with_decision;
      simChart = new Chart($("sim"), { type: "line", data: { labels: b.dates, datasets: [
        { label: "Today's path", data: b.p50, pointRadius: 0, borderWidth: 2 },
        { label: "With decision", data: w.p50, pointRadius: 0, borderWidth: 2, borderDash: [5, 4] } ] },
        options: { scales: { x: { ticks: { maxTicksLimit: 6 } }, y: { ticks: { callback: inr } } } } });
    }
  } catch (e) { $("answer").textContent = e.message; }
}

async function loadGoals() {
  const g = await api(`/api/users/${user()}/goals`);
  $("goals").innerHTML = g.map(x => `<li>${esc(x.name)}: ${inr(x.target_amount)} by ${x.target_date}</li>`).join("") || "<li class='muted'>No goals yet</li>";
}
async function addGoal(ev) {
  ev.preventDefault();
  await api(`/api/users/${user()}/goals`, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: $("gname").value, target_amount: +$("gamt").value, target_date: $("gdate").value }) });
  await analyze();
}
async function sendDigest() {
  $("digest").textContent = "Sending…";
  try { const r = await api(`/api/users/${user()}/digest`, { method: "POST" }); $("digest").textContent = `[${r.channel}] ${r.digest}`; }
  catch (e) { $("digest").textContent = e.message; }
}
async function loadAudit(runId) {
  const r = await api(`/api/runs/${runId}/audit`);
  $("audit").innerHTML = "<tr><th>Agent</th><th>Step</th><th>Decision</th><th>Reason</th></tr>" +
    r.decisions.map(d => `<tr><td>${d.agent}</td><td>${d.step}</td><td>${esc(d.decision)}</td><td>${esc(d.reason)}</td></tr>`).join("");
}
loadLatest();
</script>
</body>
</html>
